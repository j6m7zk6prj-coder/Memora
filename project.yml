# Décrit le projet Xcode. GitHub le transforme en projet Xcode avec XcodeGen avant de compiler.
name: Memora
options:
  bundleIdPrefix: com.memora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Memora:
    type: application
    platform: iOS
    sources:
      - path: Memora
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Mémora
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Mémora utilise l’appareil photo pour scanner tes cours et en faire des cartes."
        NSPhotoLibraryUsageDescription: "Mémora lit les photos de tes cours que tu choisis pour en faire des cartes."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memora.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
